<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercars Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <div class="photo">
            <img src="images/car1.jpg" alt="Car 1">
        </div>
        <div class="info">
            <h3>McLaren</h3>
            <p>Super Sport</p>
        </div>
    </div>

    <div class="card">
        <div class="photo">
            <img src="images/car2.jpg" alt="Car 2">
        </div>
        <div class="info">
            <h3>Chevrolet Camaro</h3>
            <p>Muscle Car</p>
        </div>
    </div>

    <div class="card">
        <div class="photo">
            <img src="images/car3.jpg" alt="Car 3">
        </div>
        <div class="info">
            <h3>Porsche</h3>
            <p>Luxury Sport</p>
        </div>
    </div>
</div>

</body>
</html>
