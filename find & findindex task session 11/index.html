<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Manager</title>
    <style>
        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .main-container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #f0f0f0;
            width: 350px;
        }

        .main-container h2 {
            color: #444;
            margin-bottom: 10px;
            font-size: 26px;
            font-weight: 700;
        }

        .main-container p {
            color: #777;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .calculate-btn {
            background: linear-gradient(90deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 120, 142, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .calculate-btn:hover {
            background: linear-gradient(90deg, #ff6b82 0%, #ff6aab 100%);
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(255, 120, 142, 0.6);
        }

        .calculate-btn:active {
            transform: translateY(0px);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>Courses Manager</h2>
        <p>Press the button below to enter a course name and check if it exists, or add it.</p>
        <button class="calculate-btn" onclick="manageCourses()">Check/Add Course</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
