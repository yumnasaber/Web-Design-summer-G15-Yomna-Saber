<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Seminar Schedule - Styled</title>
    <style>
        body {
            background-color: #fdf2f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        table {
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.15);
            border-radius: 12px;
            overflow: hidden;
            width: 700px;
            text-align: center;
        }

        th, td {
            padding: 14px 18px;
            border: 1px solid #fbcfe8;
        }

        th {
            background-color: #db2777;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .pink-light { background-color: #fce7f3; color: #831843; }
        .pink-medium { background-color: #f472b6; color: #ffffff; }
        .purple-soft { background-color: #e9d5ff; color: #581c87; }
        .purple-deep { background-color: #c084fc; color: #ffffff; }
        .pink-accent { background-color: #fbcfe8; color: #500724; }
        
        td {
            color: #4a5568;
            font-size: 14px;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
    </tr>

    <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topic</th>
    </tr>

    <tr>
        <th>Begin</th>
        <th>End</th>
    </tr>

    <tr>
        <td>Monday</td>
        <td class="pink-light">8:00 a.m.</td>
        <td class="purple-soft">5:00 p.m.</td>
        <td>Introduction to XML</td>
    </tr>

    <tr>
        <td rowspan="3">Tuesday</td>
        <td class="pink-medium">8:00 a.m.</td>
        <td class="purple-deep">11:00 a.m.</td>
        <td>XPath</td>
    </tr>

    <tr>
        <td class="pink-medium">11:00 a.m.</td>
        <td class="purple-deep">2:00 p.m.</td>
        <td class="pink-accent" rowspan="2">XSL Transformations</td>
    </tr>

    <tr>
        <td class="purple-deep">2:00 p.m.</td>
        <td class="pink-medium">5:00 p.m.</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td class="pink-light">8:00 a.m.</td>
        <td class="purple-soft">12:00 p.m.</td>
        <td>XSL Formatting Objects</td>
    </tr>

</table>

</body>
</html>
